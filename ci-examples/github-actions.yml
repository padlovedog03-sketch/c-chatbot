# ตัวอย่าง CI สำหรับ GitHub Actions — คัดลอกไปที่ .github/workflows/ แล้วปรับ
#
# ทำไมต้องมีไฟล์นี้: ทั่วทั้งเฟรมเวิร์กเขียนไว้ว่า "hook ทำให้การปลอมทิ้งร่องรอย ไม่ใช่
# ทำให้ปลอมไม่ได้ ตัวบังคับจริงคือ CI บนสาขาที่ป้องกันไว้" — เพราะเอเจนต์แก้ไฟล์ hook
# ในเครื่องได้ แต่แก้สิ่งที่รันบนเซิร์ฟเวอร์ของ CI ไม่ได้ ถ้าไม่มีไฟล์นี้ ประโยคนั้น
# ก็เป็นแค่คำพูด
#
# ไฟล์นี้เป็น "ตัวอย่างให้คัดลอก" ไม่ใช่ของที่บังคับใช้ทันที — วางไว้นอก .github/
# โดยตั้งใจ ทีมจะได้อ่านและปรับก่อน แล้วค่อยย้ายเข้าไปเอง

name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # ต้องดึงประวัติทั้งหมด เพราะด่านบางตัวเทียบกับ base branch
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # ด่าน 1 — เอกสารที่บอกว่า Approved ต้องมีคีย์อยู่ในทะเบียนจริง
      #
      # นี่คือด่านที่สำคัญที่สุดในไฟล์นี้ และเป็นเหตุผลที่ CI มีอยู่
      # เอเจนต์แก้ hook ในเครื่องได้ แต่แก้ขั้นตอนนี้ไม่ได้ — มันจึงเป็นชั้นเดียว
      # ที่ทำให้ "มีแต่มนุษย์ที่อนุมัติได้" เป็นจริงแทนที่จะเป็นความตั้งใจ
      #
      # ทะเบียนอยู่นอก repo (ที่ ~/.claude/approvals/registry.jsonl) จึงต้อง
      # ให้ CI อ่านจากที่ที่ทีมเก็บไว้ เช่น repo แยกที่เขียนได้เฉพาะคน หรือ
      # secret — เลือกทางแล้วแก้ REGISTRY ให้ตรง
      # ---------------------------------------------------------------
      - name: ทุกเอกสาร Approved/Done ต้องมีคีย์ในทะเบียน
        env:
          REGISTRY: ${{ secrets.APPROVAL_REGISTRY }}   # เนื้อไฟล์ JSONL
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY" > /tmp/registry.jsonl
          python3 - <<'PY'
          import json, pathlib, re, sys

          keys = set()
          for line in open('/tmp/registry.jsonl', encoding='utf-8'):
              line = line.strip()
              if line:
                  keys.add(json.loads(line)['key'])

          status_re = re.compile(r'^Status:\s*(.+?)\s*$', re.M)
          approval_re = re.compile(r'^Approval:\s*(.+?)\s*$', re.M)

          problems = []
          for path in sorted(pathlib.Path('doc').rglob('*.md')):
              if 'templates' in path.parts or 'framework' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              status = status_re.search(text)
              if not status or status.group(1) not in {'Approved', 'Done'}:
                  continue
              approval = approval_re.search(text)
              if not approval:
                  problems.append(f'{path}: Status {status.group(1)} with no Approval: line')
              elif approval.group(1) not in keys:
                  problems.append(f'{path}: Approval key {approval.group(1)!r} is not in the registry')

          if problems:
              print('เอกสารที่อ้างว่าอนุมัติแล้วแต่พิสูจน์ไม่ได้:', file=sys.stderr)
              for p in problems:
                  print('  -', p, file=sys.stderr)
              print('\nคีย์ต้องถูกเพิ่มโดยมนุษย์เท่านั้น เอเจนต์เขียนทะเบียนไม่ได้', file=sys.stderr)
              sys.exit(1)
          print('ทุกเอกสารที่อนุมัติแล้วมีคีย์รองรับครบ')
          PY

      # ---------------------------------------------------------------
      # ด่าน 2 — ประตูออกของโปรเจกต์
      # ตั้งค่าภาษา/เครื่องมือให้ตรงกับทีมก่อน (uses: actions/setup-*)
      # ---------------------------------------------------------------
      - name: ประตูออก
        run: ./scripts/verify-full.sh

      # ---------------------------------------------------------------
      # ด่าน 3 — ห้ามมีตัวยึดหลงเหลือในไฟล์ที่ไม่ใช่ template
      #
      # ตัวยึดที่รอดมาถึง production อ่านเหมือนข้อความจริง คนจึงไม่ไปตามหา
      # doc/templates/ กับ doc/framework/ ยกเว้นเพราะตั้งใจให้มีตัวยึด
      # ---------------------------------------------------------------
      - name: ไม่มีตัวยึดหลงเหลือ
        run: |
          set -euo pipefail
          LEFT=$(grep -rn '<[A-Z_]\{3,\}>' .claude doc scripts CLAUDE.md README.md 2>/dev/null \
                 | grep -v 'doc/framework/' | grep -v 'doc/templates/' \
                 | grep -v 'scripts/bootstrap.sh' || true)
          if [ -n "$LEFT" ]; then
            echo "พบตัวยึดที่ยังไม่ได้เติม:" >&2
            echo "$LEFT" >&2
            exit 1
          fi
          echo "ไม่มีตัวยึดหลงเหลือ"

      # ---------------------------------------------------------------
      # ด่าน 4 — เทสต์ของด่านอัตโนมัติเอง
      # ถ้าเทสต์ชุดนี้แดง แปลว่าด่านที่เราพึ่งพาอาจถูกเจาะได้อีกแล้ว
      # ---------------------------------------------------------------
      - name: เทสต์ hook
        run: python3 -m pytest tests/hooks/ -q
